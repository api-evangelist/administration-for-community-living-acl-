specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Administration for Community Living (ACL)
providerId: administration-for-community-living-acl-
created: '2026-05-04'
modified: '2026-08-30'
generated: '2026-08-30'
method: probed
source: >-
  Response headers observed on live calls to https://sic.acl.gov/p-agid-ui-fn and
  https://ehc.acl.gov/api on 2026-08-30, plus a search of acl.gov, agid.acl.gov
  and eldercare.acl.gov for any published limit.
tags:
  - Aging
  - Federal Government
  - Open Data
  - Rate Limiting
description: >-
  ACL publishes no rate limits for either live API surface, and no rate-limit
  signalling header was returned on any observed response. limit_count is an
  honest zero: nothing is documented and nothing is advertised at runtime, so a
  client has no way to pace itself except by backing off on failure.
limit_count: 0
limits: []
headers:
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
headers_observed: []
headers_observed_note: >-
  Full response headers were captured from POST
  https://sic.acl.gov/p-agid-ui-fn/GetDataSets. The only non-standard headers
  returned were request-context (Application Insights appId), x-azure-ref (Azure
  Front Door correlation id) and x-cache. No X-RateLimit-*, RateLimit-* or
  Retry-After header was present.
responseCodes:
  throttled: null
  quotaExceeded: null
  note: >-
    No 429 was observed and none is documented. The AGID gateway is Azure API
    Management, which supports rate-limit policies, but whether one is configured
    could not be determined without deliberately exhausting it — which was not
    attempted against a public federal service.
policies: []
note: >-
  This file previously carried a bulk-sweep scaffold (free / professional /
  enterprise tiers with invented per-minute and per-month quotas and a full set of
  X-RateLimit-* headers). None of it was published or served by ACL. It was
  replaced on 2026-08-30 with this measured record.
maintainers:
  - FN: Kin Lane
    X-twitter: apievangelist
    email: info@apievangelist.com

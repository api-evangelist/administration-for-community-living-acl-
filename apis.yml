description: >-
  The Administration for Community Living (ACL) is part of the United States
  Department of Health and Human Services. ACL works to maximize the
  independence, well-being, and health of older adults, people with disabilities
  across the lifespan, and their families and caregivers. The agency administers
  the Older Americans Act programs, supports disability services through centers
  for independent living, and maintains the AGing, Independence, and Disability
  (AGID) Program Data Portal providing publicly accessible datasets on aging and
  disability programs. ACL also operates the National Institute on Disability,
  Independent Living and Rehabilitation Research (NIDILRR).
apis:
  - aid: administration-for-community-living-acl-:agid-data-portal
    name: AGID Program Data Portal
    description: >-
      The AGing, Independence, and Disability (AGID) Program Data Portal
      provides publicly accessible data from programs funded under the Older
      Americans Act and related disability programs. Datasets include the
      American Community Survey Special Tabulation on Aging and Disability,
      National Survey of Older Americans Act Participants (NSOAAP), National
      Ombudsman Reporting System (NORS), National Adult Maltreatment Reporting
      System (NAMRS), Independent Living Services (ILS) and Centers for
      Independent Living (CIL) performance data, and I/DD (Intellectual and
      Developmental Disabilities) Longitudinal Data. Data files are available
      for download in CSV and Excel formats.
    humanURL: https://agid.acl.gov/
    baseURL: https://sic.acl.gov/p-agid-ui-fn
    baseURLNote: >-
      Undocumented. This is the Azure API Management gateway the AGID
      portal's own front end calls; the base URL and the twelve POST-only
      operation paths were read from the public bundle
      https://agid.acl.gov/assets/index-2c03a0f9.js and confirmed live on
      2026-08-30 (POST /GetDataSets -> 200). ACL publishes no reference for
      it and no way to obtain the required Ocp-Apim-Subscription-Key.
    tags:
      - Aging
      - Disability
      - Open Data
      - Older Americans Act
      - Independent Living
    properties:
      - type: Documentation
        url: https://agid.acl.gov/
      - type: DataAPI
        url: https://agid.acl.gov/DataFiles/
  - aid: administration-for-community-living-acl-:eldercare-locator-content-api
    name: Eldercare Locator Content API
    description: >-
      The Strapi 5 headless-CMS REST API behind eldercare.acl.gov, the national
      Eldercare Locator service ACL operates to connect older adults and
      caregivers to local aging and disability services. The eldercareglobal
      collection is readable anonymously and returns the standard Strapi 5
      envelope. ACL publishes no reference for this API; the base URL was read
      from the public Next.js bundle eldercare.acl.gov serves and confirmed live
      on 2026-08-30 (GET /api/eldercareglobal -> 200, application/json). Other
      Strapi collection names probed return 404, so the public role exposes a
      narrow allowlist rather than the whole content model. Read-only.
    humanURL: https://eldercare.acl.gov/
    baseURL: https://ehc.acl.gov/api
    tags:
      - Aging
      - Disability
      - Caregiving
      - Service Locator
      - Content API
    properties:
      - type: Documentation
        url: https://eldercare.acl.gov/
